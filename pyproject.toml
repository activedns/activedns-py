[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "activedns"
dynamic = ["version"]
description = "Client for the ActiveDNS API: DNS search by domain, address, network and AS number"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "attrs>=23.1",
    "httpx>=0.25,<1",
]
keywords = ["dns", "subdomains", "osint", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://activedns.net"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "build", "twine"]

[tool.hatch.version]
path = "src/activedns/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/activedns"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "e2e", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
