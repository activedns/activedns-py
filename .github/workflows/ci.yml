name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest

  # The package as it would be published, against the live API with the
  # token built into the SDK.
  e2e:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # one run at a time: the built-in token's rate limit is counted per address
    concurrency:
      group: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10" # the oldest supported
      - run: pip install build twine pytest
      - name: Build the sdist and the wheel
        run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel
        run: pip install dist/*.whl
      - run: pytest e2e -v

  # A v* tag that passed everything above is uploaded to PyPI.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing: the job proves to PyPI which workflow it is
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install build
      - name: Build the sdist and the wheel
        run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
